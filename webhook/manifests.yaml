# FIPS EMS Relaxation — MutatingAdmissionWebhook method
#
# Intercepts router pod creation and injects ConfigMap volume mounts
# with modified crypto policy. The ingress operator stays running.

# --- ConfigMap with modified crypto policy (in openshift-ingress) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fips-ems-override
  namespace: openshift-ingress
data:
  openssl_fips.config: |
    [fips_sect]
    tls1-prf-ems-check = 0
    activate = 1
  opensslcnf.config: |
    CipherString = @SECLEVEL=2:kEECDH:kEDH:kPSK:kDHEPSK:kECDHEPSK:-kRSAPSK:-kRSA:-aDSS:-CHACHA20:-SHA256:-3DES:!DES:!RC4:!RC2:!IDEA:-SEED:!eNULL:!aNULL:-CBC:-SHA1:!MD5:-SHA384:-CAMELLIA:-ARIA:-AESCCM8
    Ciphersuites = TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_AES_128_CCM_SHA256
    TLS.MinProtocol = TLSv1.2
    TLS.MaxProtocol = TLSv1.3
    DTLS.MinProtocol = DTLSv1.2
    DTLS.MaxProtocol = DTLSv1.2
    SignatureAlgorithms = ECDSA+SHA256:ECDSA+SHA384:ECDSA+SHA512:rsa_pss_pss_sha256:rsa_pss_pss_sha384:rsa_pss_pss_sha512:rsa_pss_rsae_sha256:rsa_pss_rsae_sha384:rsa_pss_rsae_sha512:RSA+SHA256:RSA+SHA384:RSA+SHA512:ECDSA+SHA224:RSA+SHA224
    Groups = secp256r1:secp521r1:secp384r1:ffdhe2048:ffdhe3072:ffdhe4096:ffdhe6144:ffdhe8192
    Options = RHNoEnforceEMSinFIPS
---
# --- Webhook namespace ---
apiVersion: v1
kind: Namespace
metadata:
  name: fips-ems-webhook
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# --- Webhook script ConfigMap ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fips-ems-webhook-script
  namespace: fips-ems-webhook
data:
  webhook.py: |
    #!/usr/bin/env python3
    import json, ssl, sys, base64
    from http.server import HTTPServer, BaseHTTPRequestHandler

    PORT = 8443
    PATCH = json.dumps([
        {"op": "add", "path": "/spec/volumes/-",
         "value": {"name": "fips-ems-override", "configMap": {"name": "fips-ems-override"}}},
        {"op": "add", "path": "/spec/containers/0/volumeMounts/-",
         "value": {"name": "fips-ems-override",
                   "mountPath": "/etc/crypto-policies/back-ends/openssl_fips.config",
                   "subPath": "openssl_fips.config", "readOnly": True}},
        {"op": "add", "path": "/spec/containers/0/volumeMounts/-",
         "value": {"name": "fips-ems-override",
                   "mountPath": "/etc/crypto-policies/back-ends/opensslcnf.config",
                   "subPath": "opensslcnf.config", "readOnly": True}},
    ])
    PATCH_B64 = base64.b64encode(PATCH.encode()).decode()
    LABEL = "ingresscontroller.operator.openshift.io/deployment-ingresscontroller"

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))))
            uid = body["request"]["uid"]
            pod = body["request"]["object"]
            labels = pod.get("metadata", {}).get("labels", {})
            volumes = pod.get("spec", {}).get("volumes", [])
            patched = any(v.get("name") == "fips-ems-override" for v in volumes)
            if LABEL in labels and not patched:
                print(f"PATCH: router pod uid={uid}", flush=True)
                resp = {"uid": uid, "allowed": True, "patchType": "JSONPatch", "patch": PATCH_B64}
            else:
                print(f"SKIP: uid={uid}", flush=True)
                resp = {"uid": uid, "allowed": True}
            review = {"apiVersion": "admission.k8s.io/v1", "kind": "AdmissionReview", "response": resp}
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(json.dumps(review).encode())
        def log_message(self, fmt, *args):
            pass

    server = HTTPServer(("0.0.0.0", PORT), Handler)
    ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
    ctx.load_cert_chain("/tls/tls.crt", "/tls/tls.key")
    server.socket = ctx.wrap_socket(server.socket, server_side=True)
    print(f"Webhook listening on :{PORT}", flush=True)
    server.serve_forever()
---
# --- Webhook Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fips-ems-webhook
  namespace: fips-ems-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fips-ems-webhook
  template:
    metadata:
      labels:
        app: fips-ems-webhook
    spec:
      containers:
        - name: webhook
          image: registry.access.redhat.com/ubi9/ubi:latest
          command: ["python3", "/scripts/webhook.py"]
          ports:
            - containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tls
          secret:
            secretName: fips-ems-webhook-tls
        - name: scripts
          configMap:
            name: fips-ems-webhook-script
            defaultMode: 0555
---
# --- Webhook Service ---
apiVersion: v1
kind: Service
metadata:
  name: fips-ems-webhook
  namespace: fips-ems-webhook
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: fips-ems-webhook-tls
spec:
  selector:
    app: fips-ems-webhook
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
# --- MutatingWebhookConfiguration ---
# NOTE: The caBundle is injected by deploy.sh at runtime.
# The webhook config is created separately with the service CA
# bundle because the inject-cabundle annotation does not reliably
# populate the caBundle field on MutatingWebhookConfiguration.
